# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]

## Annotations & source
kotlin = "2.3.0"
jspecify = "1.0.0"
lombok-plugin = "9.1.0"

## Support libraries
adventure = "4.26.1"
lmax-disruptor = "4.0.0"
typesafe-config = "1.4.5"
fastutil = "8.5.18"
guava = "33.5.0-jre"
jline = "3.30.0"
pcg = "1.0.1"
jtoml = "1.4.1"
okio = "3.16.2"

## Logging
log4j = "2.25.3"
slf4j = "2.0.17"
kotlinlogging = "7.0.14"
terminalconsoleappender = "1.3.0"

# Minestom
minestom = "2026.01.08-1.21.11"
minestom-pvp = "2025.12.29-1.21.11"

## Testing
junit = "6.0.1"

[libraries]

## Annotations & source
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

## Support libraries
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
jtoml = { module = "io.github.wasabithumb:jtoml", version.ref = "jtoml" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
pcg = { module = "dev.brachtendorf:pcg-java-10", version.ref = "pcg" }
lmax-disruptor = { module = "com.lmax:disruptor", version.ref = "lmax-disruptor" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
terminalconsoleappender = { module = "net.minecrell:terminalconsoleappender", version.ref = "terminalconsoleappender" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# JLine
jline = { module = "org.jline:jline", version.ref = "jline" }
jline-terminal-ffm = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }

## Logging
# Log4J2
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }

# SLF4J
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Kotlin logging
kotlinlogging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlinlogging" }

## Core
# Minestom
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }

# Minestom-PVP
minestom-pvp = { module = "io.github.togar2:MinestomPvP", version.ref="minestom-pvp" }

## Testing
# JUnit
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# Mocking libraries
okio-fakefilesystem = {module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio"}

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }

[bundles]
log4j-runtime = [ "log4j-core", "log4j-slf4j2-impl" ]